name: Supabase

# Apply database migrations and deploy the Edge Functions when supabase/ changes on main.
# Needs (Settings → Secrets and variables → Actions): secrets SUPABASE_ACCESS_TOKEN
# (supabase.com → Account → Access Tokens), SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_REF
# (variable or secret). The license signing key lives in Supabase itself (Edge Functions → Secrets),
# as do the store's settings (PADDLE_WEBHOOK_SECRET and PADDLE_PRODUCT_ID required, PADDLE_API_KEY and
# PADDLE_ENV), the reports' IP-hash salt and forwarding secret (REPORT_SALT, REPORT_FORWARD_SECRET), and the
# optional ALLOW_TEST_LICENSES. See README.
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - if: env.SUPABASE_ACCESS_TOKEN == '' || env.PROJECT_REF == ''
        run: echo "::notice::Supabase deploy skipped (set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF)"
      - uses: actions/checkout@v4
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: supabase link --project-ref "$PROJECT_REF"
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: supabase db push
      # The app calls them without a login (the signed license, or the one-time code, is the proof), so no JWT check.
      # paddle-webhook is called by Paddle, which proves itself with Paddle-Signature instead.
      # license-refresh is the app's daily check of the license it holds (removed, refunded or revoked turns Pro off).
      # report takes problem reports and inquiries from anyone (honeypot and a rate limit instead of a login).
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: |
          supabase functions deploy license-refresh --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy license-activate --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy license-deactivate --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy paddle-webhook --no-verify-jwt --project-ref "$PROJECT_REF"
          # license-refund is called by the site with the buyer's session: the JWT is checked.
          supabase functions deploy license-refund --project-ref "$PROJECT_REF"
          supabase functions deploy report --no-verify-jwt --project-ref "$PROJECT_REF"
