# Supabase CLI settings for this repository (migrations and Edge Functions).
project_id = "ddugit"

[functions.license-refresh]
verify_jwt = false

[functions.license-activate]
verify_jwt = false

[functions.license-deactivate]
verify_jwt = false

# The account page's "Request a refund": called with the signed-in user's session, so the JWT is checked.
[functions.license-refund]
verify_jwt = true

# Paddle's webhook: signed with Paddle-Signature, no Supabase JWT.
[functions.paddle-webhook]
verify_jwt = false

# Problem reports and inquiries from the app and /contact (through ddugit.com/api/report): no login.
[functions.report]
verify_jwt = false
