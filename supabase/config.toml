# Supabase CLI settings for this repository (migrations and Edge Functions).
project_id = "ddugit"

[functions.license-refresh]
verify_jwt = false

[functions.license-activate]
verify_jwt = false

[functions.license-deactivate]
verify_jwt = false

# Lemon Squeezy's webhook: signed with X-Signature, no Supabase JWT.
[functions.ls-webhook]
verify_jwt = false

# Problem reports and inquiries from the app and /contact (through ddugit.com/api/report): no login.
[functions.report]
verify_jwt = false
